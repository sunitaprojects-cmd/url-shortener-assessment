[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener-assessment"
version = "0.1.0"
description = "A minimal FastAPI URL shortener service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "psycopg[binary]==3.2.6",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL through DATABASE_URL",
]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 88
